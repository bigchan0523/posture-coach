# main에 올릴 때마다 안드로이드 APK를 자동으로 만든다 (Actions 탭 → 실행 결과 → Artifacts에서 다운로드)
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 엔진 테스트
        run: node test/run.mjs

      - name: 트래커 수신기 테스트 (가짜 트래커)
        run: bash native/test/run.sh

      - name: 패키지 설치
        run: npm install --no-audit --no-fund

      - name: 구글 로그인 플러그인 (firebase/google-services.json 이 있을 때만)
        run: |
          if [ -f firebase/google-services.json ]; then
            npm install --no-audit --no-fund @capacitor-firebase/authentication@6.3.1 @capacitor-firebase/firestore@6.3.1 firebase@10
            echo "Firebase 켬 (Capacitor는 package.json에 적힌 플러그인만 찾아서 빌드 중에만 추가)"
          else
            echo "firebase/google-services.json 없음 → 계정 기능 없이 빌드"
          fi

      - name: 앱 파일 준비 (MediaPipe·모델 포함)
        run: node tools/prepare-www.mjs

      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 카메라 권한 (WebView에서 getUserMedia 사용)
          # 와이파이 트래커(SlimeVR) 수신: 브로드캐스트를 받으려면 멀티캐스트 잠금 권한 필요
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$MANIFEST"
          # 운동 중 화면 회전으로 앱이 다시 시작되지 않게 세로 고정
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="portrait"#' "$MANIFEST"
          grep -n "CAMERA\|MULTICAST\|portrait" "$MANIFEST"
          # 앱이 켜져 있는 동안 화면이 꺼지지 않게 (운동 중 화면 꺼짐 방지)
          MAIN=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(head -1 "$MAIN")
          # 트래커 수신 플러그인 (native/android) 복사
          cp native/android/*.java "$(dirname "$MAIN")"/
          cat > "$MAIN" <<JAVA
          $PKG

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SlimeVRPlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          JAVA
          cat "$MAIN"
          # 앱 아이콘 배경: 격자 무늬 → 완전 흰색 (파란 도형은 그대로)
          RES=android/app/src/main/res
          cat > "$RES/drawable/ic_launcher_background.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z" />
          </vector>
          XML
          sed -i 's#<color name="ic_launcher_background">[^<]*</color>#<color name="ic_launcher_background">\#FFFFFF</color>#' "$RES/values/ic_launcher_background.xml" 2>/dev/null || true
          # 격자 없는 새 아이콘 그림 (resources/android → res)
          cp -r resources/android/. "$RES"/
          # Firebase 설정 파일 + 구글 로그인 사용 표시
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
            cat android/variables.gradle
          fi
          cat "$RES"/mipmap-anydpi-v26/ic_launcher.xml
          npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          # 항상 같은 서명 키로 빌드 → 폰에서 지우지 않고 덮어 설치 가능 (기록 유지). 구글 로그인도 이 키의 SHA-1로 등록
          # (~/.android에 두는 방식은 러너에서 무시돼서, 빌드 설정에 직접 지정)
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../build-keys/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          tail -12 app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: posture-coach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 폰에서 바로 받을 수 있게 Releases의 'latest'에 APK를 올린다 (매 빌드마다 교체)
      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk posture-coach.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest posture-coach.apk --title "최신 APK" --notes "커밋 ${GITHUB_SHA::7} 빌드. 폰에서 posture-coach.apk를 받아 설치하세요." --latest
