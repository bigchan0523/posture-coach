# main에 올릴 때마다 안드로이드 APK를 자동으로 만든다 (Actions 탭 → 실행 결과 → Artifacts에서 다운로드)
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 엔진 테스트
        run: node test/run.mjs

      - name: 패키지 설치
        run: npm install --no-audit --no-fund

      - name: 앱 파일 준비 (MediaPipe·모델 포함)
        run: node tools/prepare-www.mjs

      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 카메라 권한 (WebView에서 getUserMedia 사용)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$MANIFEST"
          # 운동 중 화면 회전으로 앱이 다시 시작되지 않게 세로 고정
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="portrait"#' "$MANIFEST"
          grep -n "CAMERA\|portrait" "$MANIFEST"
          # 앱이 켜져 있는 동안 화면이 꺼지지 않게 (운동 중 화면 꺼짐 방지)
          MAIN=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(head -1 "$MAIN")
          cat > "$MAIN" <<JAVA
          $PKG

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          JAVA
          cat "$MAIN"
          npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: posture-coach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 폰에서 바로 받을 수 있게 Releases의 'latest'에 APK를 올린다 (매 빌드마다 교체)
      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk posture-coach.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest posture-coach.apk --title "최신 APK" --notes "커밋 ${GITHUB_SHA::7} 빌드. 폰에서 posture-coach.apk를 받아 설치하세요." --latest
