# main에 올릴 때마다 안드로이드 APK를 자동으로 만든다 (Actions 탭 → 실행 결과 → Artifacts에서 다운로드)
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 엔진 테스트
        run: node test/run.mjs

      - name: 트래커 수신기 테스트 (가짜 트래커)
        run: bash native/test/run.sh

      - name: 패키지 설치
        run: npm install --no-audit --no-fund

      - name: 구글 로그인 플러그인 (firebase/google-services.json 이 있을 때만)
        run: |
          if [ -f firebase/google-services.json ]; then
            npm install --no-audit --no-fund @capacitor-firebase/authentication@6.3.1 @capacitor-firebase/firestore@6.3.1 firebase@10
            echo "Firebase 켬 (Capacitor는 package.json에 적힌 플러그인만 찾아서 빌드 중에만 추가)"
          else
            echo "firebase/google-services.json 없음 → 계정 기능 없이 빌드"
          fi

      - name: 앱 파일 준비 (MediaPipe·모델 포함)
        run: node tools/prepare-www.mjs

      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 카메라 권한 (WebView에서 getUserMedia 사용)
          # 와이파이 트래커(SlimeVR) 수신: 브로드캐스트를 받으려면 멀티캐스트 잠금 권한 필요
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$MANIFEST"
          # 운동 중 화면 회전으로 앱이 다시 시작되지 않게 세로 고정
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="portrait"#' "$MANIFEST"
          grep -n "CAMERA\|MULTICAST\|portrait" "$MANIFEST"
          # 앱이 켜져 있는 동안 화면이 꺼지지 않게 (운동 중 화면 꺼짐 방지)
          MAIN=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(head -1 "$MAIN")
          # 트래커 수신 플러그인 (native/android) 복사
          cp native/android/*.java "$(dirname "$MAIN")"/
          cat > "$MAIN" <<JAVA
          $PKG

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SlimeVRPlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  // 안드로이드 15+는 앱을 화면 끝까지 그림 → 상태바·아래 버튼·키보드 만큼 여백을 줘서 가려지지 않게
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().getDecorView().setBackgroundColor(Color.WHITE);
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightStatusBars(true);
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightNavigationBars(true);
                  View content = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                      Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                      Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                      v.setPadding(bars.left, bars.top, bars.right, Math.max(bars.bottom, ime.bottom));
                      return WindowInsetsCompat.CONSUMED;
                  });
              }
          }
          JAVA
          cat "$MAIN"
          # 앱 아이콘 배경: 격자 무늬 → 완전 흰색 (파란 도형은 그대로)
          RES=android/app/src/main/res
          cat > "$RES/drawable/ic_launcher_background.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z" />
          </vector>
          XML
          sed -i 's#<color name="ic_launcher_background">[^<]*</color>#<color name="ic_launcher_background">\#FFFFFF</color>#' "$RES/values/ic_launcher_background.xml" 2>/dev/null || true
          # 격자 없는 새 아이콘 그림 (resources/android → res)
          cp -r resources/android/. "$RES"/
          # Firebase 설정 파일 + 구글 로그인 사용 표시
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
            cat android/variables.gradle
          fi
          cat "$RES"/mipmap-anydpi-v26/ic_launcher.xml
          # 플레이 스토어 조건: 새 앱은 Android 16(API 36) 대상, Play 자동 보호는 최소 Android 7(API 24) → SDK 36 + 그걸 지원하는 빌드 도구(AGP 8.10)
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/; s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle
          sed -i "s#com.android.tools.build:gradle:[0-9.]*#com.android.tools.build:gradle:8.10.1#" android/build.gradle
          sed -i "s#gradle-[0-9.]*-all.zip#gradle-8.11.1-all.zip#" android/gradle/wrapper/gradle-wrapper.properties
          grep -n "Sdk" android/variables.gradle; grep -n "tools.build" android/build.gradle; grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          # 앱 버전: 이름은 VERSION 파일, 번호는 빌드 번호 (스토어에 올릴 때마다 커져야 함)
          VER=$(cat VERSION)
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          # 안드로이드 16의 '뒤로 가기 미리보기' 대신 지금처럼 앱이 뒤로 가기를 직접 처리
          sed -i 's#<application#<application\n        android:enableOnBackInvokedCallback="false"#' "$MANIFEST"
          npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          # 항상 같은 서명 키로 빌드 → 폰에서 지우지 않고 덮어 설치 가능 (기록 유지). 구글 로그인도 이 키의 SHA-1로 등록
          # (~/.android에 두는 방식은 러너에서 무시돼서, 빌드 설정에 직접 지정)
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../build-keys/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          tail -12 app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 플레이 스토어용 AAB: 업로드 키로 서명. 키 파일·비밀번호는 저장소가 아니라 GitHub Secrets에만 있음
      #   UPLOAD_KEYSTORE_B64 (키 파일을 base64로 바꾼 글자), UPLOAD_KEYSTORE_PASSWORD
      - name: 플레이 스토어용 AAB 빌드 (업로드 키가 Secrets에 있을 때만)
        working-directory: android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then echo "업로드 키 Secrets 없음 → AAB 건너뜀"; exit 0; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  upload {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/upload.jks")
                      storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                      keyAlias "jakojako-upload"
                      keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: posture-coach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 폰에서 바로 받을 수 있게 Releases의 'latest'에 APK(+ 있으면 스토어용 AAB)를 올린다 (매 빌드마다 교체)
      - name: 릴리스에 APK·AAB 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat VERSION)
          cp android/app/build/outputs/apk/debug/app-debug.apk posture-coach.apk
          FILES="posture-coach.apk"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then cp "$AAB" "jakojako-$VER.aab"; FILES="$FILES jakojako-$VER.aab"; fi
          gh release delete latest -y --cleanup-tag || true
          gh release create latest $FILES --title "최신 APK ($VER, 빌드 ${{ github.run_number }})" --notes "커밋 ${GITHUB_SHA::7} 빌드. 폰에서 posture-coach.apk를 받아 설치하세요. jakojako-$VER.aab 는 플레이 스토어 업로드용." --latest
