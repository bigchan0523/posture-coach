<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <title>자세 코치</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 앱을 켤 때 3초 정도 보이는 시작 화면 -->
  <div id="splash" class="splash" role="img" aria-label="자세 코치, 오늘의 운동">
    <img src="img/logo.svg" alt="">
    <p>오늘의 운동</p>
  </div>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="메뉴">
      <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>홈</span></button>
      <button data-tab="workouts"><svg viewBox="0 0 24 24"><path d="M3 10h2v4H3zM19 10h2v4h-2zM6 7h3v10H6zM15 7h3v10h-3zM9 11h6v2H9z"/></svg><span>운동</span></button>
      <button data-tab="records"><svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zM10.5 20V4h3v16zM17 20v-7h3v7z"/></svg><span>기록</span></button>
    </nav>
  </div>

  <!-- 운동 진행 화면 -->
  <section id="session" class="session" hidden aria-label="운동 진행">
    <video id="sVideo" playsinline muted></video>
    <canvas id="sCanvas"></canvas>
    <header class="s-top">
      <div class="s-head"><h2 id="sTitle"></h2><p id="sSub"></p></div>
      <button id="sClose" class="s-icon" data-act="close" aria-label="운동 끝내기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="s-hud">
      <div class="s-ring" id="sRing">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle id="sRingBar" class="bar" cx="60" cy="60" r="52"/></svg>
        <div class="s-num"><span id="sCount">0</span><small id="sTarget"></small></div>
      </div>
      <span id="sGrade" class="s-grade" hidden></span>
    </div>
    <div id="sNotice" class="s-notice" hidden></div>
    <ul id="sMessages" class="s-messages" aria-live="polite"></ul>
    <div id="sPanel" class="s-panel" hidden></div>
    <div id="sControls" class="s-controls">
      <button id="sPause" class="btn ghost" data-act="pause">일시정지</button>
      <button id="sSkip" class="btn ghost" data-act="skip">건너뛰기</button>
    </div>
    <pre id="sDebug" class="s-debug" hidden></pre>
  </section>

  <!-- 설정 등 아래에서 올라오는 창 -->
  <div id="sheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
  <input id="videoInput" type="file" accept="video/*" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
